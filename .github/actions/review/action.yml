name: "OgenticAI Reviewer"
description: >-
  Review a PR against its linked Linear ticket's UAT checklist.
  Posts a sticky per-item verdict comment, mirrors to Linear, and (when
  configured) sets a required Check that gates merge.
author: "OgenticAI"
branding:
  icon: "shield"
  color: "purple"

inputs:
  anthropic_api_key:
    description: "Anthropic API key. Use ${{ secrets.ANTHROPIC_API_KEY }}."
    required: true
  github_app_id:
    description: "OgenticAI Reviewer GitHub App ID."
    required: true
  github_app_private_key:
    description: "OgenticAI Reviewer GitHub App private key (PEM, base64 OK)."
    required: true
  linear_api_token:
    description: "Linear API token. Used by the Linear MCP for ticket reads + writeback."
    required: true
  auto_patch:
    description: "If 'true', open a draft patch PR for mechanically-fixable UAT failures."
    required: false
    default: "false"
  fail_on:
    description: >-
      Which OverallStatus values should set the Check to 'failure'.
      Comma-separated subset of NEEDS_WORK, HUMAN_REVIEW. Default: NEEDS_WORK.
      The reviewer never sets 'failure' on internal infra errors — those go to 'neutral'.
    required: false
    default: "NEEDS_WORK"

runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.github_app_id }}
        private-key: ${{ inputs.github_app_private_key }}
        owner: ${{ github.repository_owner }}

    - name: Run claude-code-action review
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ steps.app_token.outputs.token }}
        # The system + user prompts are baked into the prompts/ directory so
        # they version with the agent. Bumping REVIEWER_VERSION in source
        # invalidates the sticky comment marker (see src/version.ts).
        prompt_file: ${{ github.action_path }}/prompts/review.md
        # Allow only the tools the reviewer actually needs. Locked-down on purpose.
        allowed_tools: |
          Bash(gh pr view:*)
          Bash(gh pr diff:*)
          Bash(gh issue list:*)
          Bash(gh api:*)
          Read
          mcp__linear__*
        # The Linear MCP gives the model read+write on Linear tickets.
        # Ticket parsing, checklist extraction, sticky-comment upserting,
        # and follow-up-issue creation all happen via tools, not via custom code.
        mcp_config: |
          {
            "mcpServers": {
              "linear": {
                "command": "npx",
                "args": ["-y", "@linear/mcp@latest"],
                "env": {
                  "LINEAR_API_KEY": "${{ inputs.linear_api_token }}"
                }
              }
            }
          }
        # Keep verdicts deterministic.
        model: "claude-sonnet-4-5"
        # The action reads the PR event payload from $GITHUB_EVENT_PATH; we
        # forward the auto_patch + fail_on flags so the prompt can branch.
        env: |
          OGENTICAI_REVIEWER_AUTO_PATCH=${{ inputs.auto_patch }}
          OGENTICAI_REVIEWER_FAIL_ON=${{ inputs.fail_on }}
