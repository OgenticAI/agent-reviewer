name: "OgenticAI Reviewer"
description: >-
  Review a PR against its linked Linear ticket's UAT checklist.
  Posts a sticky per-item verdict comment under a GitHub App identity, and
  publishes a Check that downstream branch protection (OGE-340) can require.
author: "OgenticAI"
branding:
  icon: "shield"
  color: "purple"

inputs:
  anthropic_api_key:
    # Pass via `secrets.ANTHROPIC_API_KEY` from the calling workflow. We don't
    # write the literal `${{ secrets.ANTHROPIC_API_KEY }}` here because GitHub
    # parses expression syntax inside `description` fields and `secrets` isn't
    # available in the composite-action context — that fails the action load.
    description: "Anthropic API key. Pass from the caller's secrets context."
    required: true
  github_app_id:
    description: "OgenticAI Reviewer GitHub App ID."
    required: true
  github_app_private_key:
    description: "OgenticAI Reviewer GitHub App private key (PEM)."
    required: true
  linear_api_token:
    description: "Linear API token used to fetch the linked ticket."
    required: true
  fail_on:
    description: >-
      Comma-separated list of OverallStatus values that should set the Check to
      'failure'. Default: empty — the v1 advisory mode never fails the Check.
      Bumping this is the lever that flips the reviewer from advisory to
      enforcing (see OGE-340).
    required: false
    default: ""

# Outputs the calling workflow can read off this Action.
outputs:
  overall:
    description: "Overall verdict: PASS | PASS_WITH_PARTIALS | NEEDS_WORK | HUMAN_REVIEW | SKIPPED"
    value: ${{ steps.review.outputs.overall }}
  comment_url:
    description: "URL of the sticky comment that was created or updated."
    value: ${{ steps.review.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.github_app_id }}
        private-key: ${{ inputs.github_app_private_key }}
        owner: ${{ github.repository_owner }}

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: "20"

    - name: Install reviewer
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      # The Action lives inside the agent-reviewer repo; its package.json is
      # the runtime. `npm ci` is fine because we ship a committed lockfile.
      run: npm ci --omit=dev=false --silent

    - name: Run review
      id: review
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        LINEAR_API_TOKEN: ${{ inputs.linear_api_token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        VERDICT_PATH: ${{ runner.temp }}/verdict.json
      run: |
        set +e  # the reviewer must never fail the Action; it sets a Check instead
        npx tsx src/cli.ts review-pr "$PR_URL" --post --output-json "$VERDICT_PATH"
        rc=$?
        if [ $rc -eq 0 ]; then
          overall=$(node -e "console.log(require(process.env.VERDICT_PATH).items.reduce((acc,it)=>{if(it.status==='FAIL')return 'NEEDS_WORK';if(it.status==='UNVERIFIABLE'&&acc!=='NEEDS_WORK')return 'HUMAN_REVIEW';if(it.status==='PARTIAL'&&!['NEEDS_WORK','HUMAN_REVIEW'].includes(acc))return 'PASS_WITH_PARTIALS';return acc;},'PASS'))")
        elif [ $rc -eq 3 ]; then
          overall="SKIPPED"
        else
          overall="ERROR"
        fi
        echo "overall=$overall" >> "$GITHUB_OUTPUT"
        echo "Reviewer exit code: $rc"
        echo "Overall verdict: $overall"
        # Don't fail the step on review issues — the Check carries that signal.
        exit 0

    - name: Publish GitHub Check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        OVERALL: ${{ steps.review.outputs.overall }}
        FAIL_ON: ${{ inputs.fail_on }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Map OverallStatus → GitHub Check conclusion. The reviewer never
        # blocks merges on its own infra outages: ERROR → neutral, not failure.
        # `fail_on` is the per-repo lever that promotes specific overalls
        # to `failure`. Empty fail_on (the default) keeps v1 advisory.
        case "$OVERALL" in
          PASS|PASS_WITH_PARTIALS) conclusion="success" ;;
          HUMAN_REVIEW) conclusion="neutral" ;;
          SKIPPED) conclusion="skipped" ;;
          NEEDS_WORK)
            if echo ",$FAIL_ON," | grep -q ",NEEDS_WORK,"; then
              conclusion="failure"
            else
              conclusion="neutral"
            fi
            ;;
          ERROR|*) conclusion="neutral" ;;
        esac
        # Title needs to be reasonably stable for branch-protection contexts to match.
        gh api -X POST "repos/$OWNER/$REPO/check-runs" \
          -f name='OgenticAI Reviewer / UAT' \
          -f head_sha="$HEAD_SHA" \
          -f status='completed' \
          -f conclusion="$conclusion" \
          -f "output[title]=UAT verdict: $OVERALL" \
          -f "output[summary]=See the sticky comment for the per-item table."
