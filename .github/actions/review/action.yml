name: "OgenticAI Reviewer"
description: >-
  Review a PR against its linked Linear ticket's UAT checklist.
  Posts a sticky per-item verdict comment under a GitHub App identity, and
  publishes a Check that downstream branch protection (OGE-340) can require.
author: "OgenticAI"
branding:
  icon: "shield"
  color: "purple"

inputs:
  anthropic_api_key:
    # Pass via `secrets.ANTHROPIC_API_KEY` from the calling workflow. We don't
    # write the literal `${{ secrets.ANTHROPIC_API_KEY }}` here because GitHub
    # parses expression syntax inside `description` fields and `secrets` isn't
    # available in the composite-action context — that fails the action load.
    description: "Anthropic API key. Pass from the caller's secrets context."
    required: true
  github_app_id:
    description: "OgenticAI Reviewer GitHub App ID."
    required: true
  github_app_private_key:
    description: "OgenticAI Reviewer GitHub App private key (PEM)."
    required: true
  linear_api_token:
    description: "Linear API token used to fetch the linked ticket."
    required: true
  fail_on:
    description: >-
      Comma-separated list of OverallStatus values that should set the Check to
      'failure'. Default: empty — the v1 advisory mode never fails the Check.
      Bumping this is the lever that flips the reviewer from advisory to
      enforcing (see OGE-340).

      Note on CODE_VERIFIED (OGE-1580): items with that verdict never gate a
      merge. Like `[human]`-marked items they are excluded from the punt
      roll-up — CODE_VERIFIED means the code demonstrably delivers the item and
      only runtime validation is outstanding, so it rolls up as
      PASS_WITH_PARTIALS rather than HUMAN_REVIEW. A checklist of nothing but
      CODE_VERIFIED items is deliberately NOT reported as a clean PASS.
    required: false
    default: ""
  research:
    description: >-
      When 'true', the reviewer may use Anthropic's server-side web search to
      narrow the factual half of a `[human]`-marked UAT item, citing only
      allowlisted standards sources (OGE-1566). Off by default.

      Leave this OFF for repos importing @ogenticai/shield or @ogenticai/audit,
      and for the Therapy and Private Credit verticals. The model composes the
      search query and Anthropic dispatches it, so queries are audited after
      the fact rather than gated before they leave — that is detection, not
      prevention, and is not an acceptable trade where a leak would be PHI or
      MNPI. Those repos wait for the client-side search path.

      No effect on PRs with no `[human]`-marked items: the request carries no
      tools array at all.
    required: false
    default: "false"
  diff_token_budget:
    description: >-
      Approximate token budget for the diff section of the prompt (OGE-1581).
      Deliberately a fraction of the context window: the checklist, ticket, CI
      summary, and every tool result have to fit alongside it, and those are
      what actually settle items. Files that do not fit are listed by path in
      the prompt so the model reads them or punts with a concrete reason —
      never silently misses them.
    required: false
    default: "24000"
  exclude_globs:
    description: >-
      Comma-separated repo-relative globs to drop from the diff entirely, e.g.
      "generated/**,vendor/**". Lockfiles, build output, and files marked
      @generated are already excluded without configuration.
    required: false
    default: ""
  findings_fail_level:
    description: >-
      Deterministic analyzer/test gate, independent of the LLM verdict
      (OGE-1588). When set to 'error', 'warning', or 'info', ingested findings
      at or above that severity fail the Check on their own — "tsc reported 3
      errors" is not a matter of opinion the model gets to overrule. Default
      'off': findings still reach the prompt as established facts, but never
      gate the merge.

      Ingestion PARSES analyzer output; it never EXECUTES a PR-supplied config.
      That distinction is the whole reason it adds no attack surface — see the
      Kudelski RCE that came through executing a PR's `.rubocop.yml`.
    required: false
    default: "off"
  inline_comments:
    description: >-
      When 'true', anchor FAIL/PARTIAL evidence as inline review comments on the
      changed lines, with a two-channel fallback: findings whose evidence is
      outside the diff go into an "evidence outside this diff" section of the
      sticky comment, never dropped (OGE-1586). Default 'false'.

      Each comment is posted individually via pulls.createReviewComment. The
      reviewer NEVER submits a formal GitHub review or approves a PR — that is
      forbidden by design, matching claude-code-action's own boundary.
    required: false
    default: "false"
  incremental_min_commits:
    description: >-
      Minimum new commits since the last review before the reviewer takes the
      incremental path (OGE-1590) — carrying untouched verdicts forward instead
      of re-reviewing the whole checklist. Below this, a full review runs. An
      item whose evidence files did not change on the push keeps its prior
      verdict (annotated "verified at <sha>"), so an unrelated push cannot churn
      it; every FAIL and every touched item is always re-verified. Default 1.
    required: false
    default: "1"
  incremental_min_minutes:
    description: >-
      Minimum minutes since the last review before taking the incremental path
      (OGE-1590). Default 0 (no time gate). Pair with incremental_min_commits.
    required: false
    default: "0"
  repo_map:
    description: >-
      When 'true', a ranked, signature-only repo map is injected read-only into
      the prompt before the tool loop (OGE-1582), so repo-wide claims ("is this
      called elsewhere?", "does every path emit an audit event?") are answered
      from a standing symbol map instead of costing tool iterations. Ranked by
      personalized PageRank over the symbol graph, seeded from diff-touched files
      and checklist identifiers. Off by default.
    required: false
    default: "false"
  map_tokens:
    description: >-
      Base token budget for the repo map (OGE-1582). The effective budget scales
      INVERSELY with diff size — a small diff with repo-wide claims gets a big
      map; a large diff gets a small one (down to 25% of this). Default 1024.
    required: false
    default: "1024"
  triage:
    description: >-
      When 'true', a cheap haiku-class pass runs before the expensive review
      (OGE-1595), classifying each checklist item as trivial / untouched /
      needs_tools over the checklist + changed-file list (not the full diff).
      needs_tools items get their suggested files prioritized in the diff pack.
      Fail-open: any triage error falls back to today's uniform behaviour, so it
      can only make the review cheaper, never wrong. Off by default.
    required: false
    default: "false"
  adjudication:
    description: >-
      When 'true', every UNVERIFIABLE verdict gets one cheap second-pass call
      that asks whether the item was actually decidable from the evidence the
      reviewer already gathered (OGE-1587). Off by default.

      Bounded and one-directional: punts the checklist linter classes as
      legitimately human (post-merge, operator-action, prod-credentials) and
      `[human]`-marked items are never challenged and spend no call. Every
      ambiguous outcome — API error, unparseable reply, confidence below the
      floor — keeps the original punt. The pass can only ever REDUCE the punt
      count by finding evidence; it can never manufacture a PASS from silence.
    required: false
    default: "false"
  adjudication_model:
    description: >-
      Model used for the adjudication pass. Defaults to a Haiku-class model —
      the job is one narrow binary question over already-gathered evidence, not
      a second full review.
    required: false
    default: "claude-haiku-4-5"
  auto_patch:
    description: >-
      When 'true' AND the verdict has at least one FAIL item flagged
      autoPatchable=true, fire a focused claude-code-action invocation to
      open a draft 'chore(uat): suggest fixes' PR. Off by default for v1
      (see OGE-341).
    required: false
    default: "false"

# Outputs the calling workflow can read off this Action.
outputs:
  overall:
    description: "Overall verdict: PASS | PASS_WITH_PARTIALS | NEEDS_WORK | HUMAN_REVIEW | SKIPPED"
    value: ${{ steps.review.outputs.overall }}
  comment_url:
    description: "URL of the sticky comment that was created or updated."
    value: ${{ steps.review.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.github_app_id }}
        private-key: ${{ inputs.github_app_private_key }}
        owner: ${{ github.repository_owner }}

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: "20"
        # The action installs its own deps via `npm ci` from a different
        # working dir (the agent-reviewer checkout, not the consumer repo).
        # Without this flag, setup-node@v5 auto-detects any pnpm-lock.yaml /
        # yarn.lock at consumer-repo root and tries to enable that PM's
        # cache — which then fails with `Unable to locate executable file:
        # pnpm` (or yarn) because we never install those tools. Keeping
        # the cache off makes the action self-contained for any consumer
        # regardless of their package-manager-of-choice.
        package-manager-cache: false

    - name: Install reviewer
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      # The Action lives inside the agent-reviewer repo; its package.json is
      # the runtime. `npm ci` is fine because we ship a committed lockfile.
      run: npm ci --omit=dev=false --silent

    - name: Run review
      id: review
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        LINEAR_API_TOKEN: ${{ inputs.linear_api_token }}
        REVIEWER_RESEARCH: ${{ inputs.research }}
        REVIEWER_DIFF_TOKEN_BUDGET: ${{ inputs.diff_token_budget }}
        REVIEWER_EXCLUDE_GLOBS: ${{ inputs.exclude_globs }}
        REVIEWER_FINDINGS_FAIL_LEVEL: ${{ inputs.findings_fail_level }}
        REVIEWER_INLINE_COMMENTS: ${{ inputs.inline_comments }}
        REVIEWER_TRIAGE: ${{ inputs.triage }}
        REVIEWER_REPO_MAP: ${{ inputs.repo_map }}
        REVIEWER_MAP_TOKENS: ${{ inputs.map_tokens }}
        REVIEWER_INCREMENTAL_MIN_COMMITS: ${{ inputs.incremental_min_commits }}
        REVIEWER_INCREMENTAL_MIN_MINUTES: ${{ inputs.incremental_min_minutes }}
        REVIEWER_ADJUDICATION: ${{ inputs.adjudication }}
        REVIEWER_ADJUDICATION_MODEL: ${{ inputs.adjudication_model }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        VERDICT_PATH: ${{ runner.temp }}/verdict.json
      run: |
        set +e  # the reviewer must never fail the Action; it sets a Check instead
        npx tsx src/cli.ts review-pr "$PR_URL" --post --output-json "$VERDICT_PATH"
        rc=$?
        if [ $rc -eq 0 ]; then
          # `overall` is computed by overallStatus() and written into the
          # sidecar by the CLI. This used to be a reimplementation of that
          # reduce inline, which diverged as soon as `[human]` items were
          # excluded from the roll-up (OGE-1559). Read it, don't recompute it.
          overall=$(node -e "console.log(require(process.env.VERDICT_PATH).overall)")
          # Deterministic findings gate (OGE-1588) — independent of the verdict.
          findings_failed=$(node -e "console.log(require(process.env.VERDICT_PATH).findingsGateFailed === true ? 'true' : 'false')")
          echo "findings_failed=$findings_failed" >> "$GITHUB_OUTPUT"
        elif [ $rc -eq 3 ]; then
          overall="SKIPPED"
        else
          overall="ERROR"
        fi
        echo "overall=$overall" >> "$GITHUB_OUTPUT"
        echo "Reviewer exit code: $rc"
        echo "Overall verdict: $overall"
        # Don't fail the step on review issues — the Check carries that signal.
        exit 0

    - name: Publish GitHub Check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        OVERALL: ${{ steps.review.outputs.overall }}
        FINDINGS_FAILED: ${{ steps.review.outputs.findings_failed }}
        FAIL_ON: ${{ inputs.fail_on }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Map OverallStatus → GitHub Check conclusion. The reviewer never
        # blocks merges on its own infra outages: ERROR → neutral, not failure.
        # `fail_on` is the per-repo lever that promotes specific overalls
        # to `failure`. Empty fail_on (the default) keeps v1 advisory.
        case "$OVERALL" in
          PASS|PASS_WITH_PARTIALS) conclusion="success" ;;
          HUMAN_REVIEW) conclusion="neutral" ;;
          SKIPPED) conclusion="skipped" ;;
          NEEDS_WORK)
            if echo ",$FAIL_ON," | grep -q ",NEEDS_WORK,"; then
              conclusion="failure"
            else
              conclusion="neutral"
            fi
            ;;
          ERROR|*) conclusion="neutral" ;;
        esac
        # The analyzer gate is deterministic and overrules a passing verdict:
        # an error-level finding fails the Check whatever the model concluded.
        if [ "$FINDINGS_FAILED" = "true" ]; then
          conclusion="failure"
        fi
        # Title needs to be reasonably stable for branch-protection contexts to match.
        gh api -X POST "repos/$OWNER/$REPO/check-runs" \
          -f name='OgenticAI Reviewer / UAT' \
          -f head_sha="$HEAD_SHA" \
          -f status='completed' \
          -f conclusion="$conclusion" \
          -f "output[title]=UAT verdict: $OVERALL" \
          -f "output[summary]=See the sticky comment for the per-item table."

    # ── Auto-patch (OGE-341) ────────────────────────────────────────────────
    # When `auto_patch: true` AND the verdict has at least one item with
    # status=FAIL && autoPatchable=true, fire a focused claude-code-action
    # invocation that creates a draft PR with a candidate fix. We delegate
    # branching/committing/PR-opening to claude-code-action because that's
    # what it's built for; we just hand it a tightly-scoped prompt.
    #
    # Disabled by default. Enabling per-repo via the workflow input.
    - name: Check if auto-patch should run
      id: should_autopatch
      if: inputs.auto_patch == 'true'
      shell: bash
      env:
        VERDICT_PATH: ${{ runner.temp }}/verdict.json
      run: |
        if [ ! -f "$VERDICT_PATH" ]; then
          echo "should=false" >> "$GITHUB_OUTPUT"
          echo "No verdict file — skipping auto-patch."
          exit 0
        fi
        items=$(node -e "
          const v = require(process.env.VERDICT_PATH);
          const fails = (v.items || []).filter(it => it.status === 'FAIL' && it.autoPatchable === true);
          if (fails.length === 0) { console.log(''); process.exit(0); }
          console.log(fails.map(it => '- (#' + it.id + ') ' + it.itemText + ' — ' + it.rationale).join('\n'));
        ")
        if [ -z "$items" ]; then
          echo "should=false" >> "$GITHUB_OUTPUT"
          echo "No FAIL items marked autoPatchable=true — skipping auto-patch."
        else
          echo "should=true" >> "$GITHUB_OUTPUT"
          # GH Actions multiline output
          {
            echo "items<<__OGENTICAI_EOF__"
            echo "$items"
            echo "__OGENTICAI_EOF__"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Open auto-patch draft PR
      id: autopatch_run
      if: steps.should_autopatch.outputs.should == 'true'
      # Don't fail the outer reviewer workflow if the inner Claude action
      # has a hiccup — we want the diagnostic step below to always run so
      # OGE-395 has the data to triage.
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ steps.app_token.outputs.token }}
        model: "claude-sonnet-4-5"
        prompt: |
          The OgenticAI Reviewer flagged the following UAT items on PR
          #${{ github.event.pull_request.number }} as mechanically fixable
          failures (status=FAIL, autoPatchable=true):

          ${{ steps.should_autopatch.outputs.items }}

          Your job:
          1. Check out the PR's head branch.
          2. For each item, write the smallest possible fix — add the missing
             test, write the missing docstring, update the stale README claim,
             bump the version. Do NOT redesign anything. Do NOT touch unrelated
             files. If a fix isn't obvious or safe, skip it and note why in the
             draft PR body.
          3. Commit each change with a focused message ("test: add coverage for
             X", "docs: document Y", etc.).
          4. Open a *draft* PR titled
             `chore(uat): suggest fixes for ${{ github.event.pull_request.head.ref }}`
             targeting the same branch this PR is from. Include in the body:
               - A link back to the original PR
               - The list of items above with checkboxes for each
               - A note that this is suggestive only — close it if the
                 maintainer wants to fix differently
        allowed_tools: |
          Bash(git *:*)
          Bash(gh pr create:*)
          Bash(gh pr view:*)
          Read
          Edit
          Write

    # ─── OGE-395 diagnostic ─────────────────────────────────────────────────
    # The auto-patch action (above) has been observed to exit `success` and
    # produce no draft PR. This step captures everything we need to triage
    # *why*: the inner step's outcome, working-directory state, branches the
    # inner action created locally + pushed, and any chore(uat) PRs that
    # exist on the repo (so we can tell whether a PR was created but missed
    # in some other way).
    #
    # Always runs when the gate said `should=true`, regardless of whether
    # the inner action succeeded — `continue-on-error: true` above lets this
    # step observe failures too.
    - name: Diagnose auto-patch outcome (OGE-395)
      if: steps.should_autopatch.outputs.should == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: |
        set +e   # diagnostics must never break the workflow
        echo "::group::auto-patch action outcome"
        echo "outcome=${{ steps.autopatch_run.outcome }}"
        echo "conclusion=${{ steps.autopatch_run.conclusion }}"
        echo "::endgroup::"

        echo "::group::working directory state"
        echo "pwd=$(pwd)"
        echo "HEAD=$(git rev-parse HEAD 2>/dev/null || echo 'no HEAD')"
        echo "current-branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'detached')"
        echo "--- git status --porcelain ---"
        git status --porcelain 2>&1 | head -40
        echo "--- git log --oneline -5 ---"
        git log --oneline -5 2>&1
        echo "::endgroup::"

        echo "::group::local branches (post-action)"
        git branch -v 2>&1 | head -20
        echo "::endgroup::"

        echo "::group::remote branches created in the last 10 min"
        git fetch origin --prune --quiet 2>/dev/null
        # ISO timestamp 10 min ago (portable across GNU/BSD date)
        TEN_MIN_AGO=$(python3 -c "import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(minutes=10)).isoformat())" 2>/dev/null)
        git for-each-ref --sort=-creatordate --count=15 \
          --format='%(refname:short) %(creatordate:iso-strict)' refs/remotes/origin/ 2>&1 \
          | awk -v cutoff="$TEN_MIN_AGO" '$2 >= cutoff || cutoff == "" { print "  " $0 }'
        echo "::endgroup::"

        echo "::group::draft PRs by ogenticai-reviewer[bot] currently open"
        gh pr list \
          --repo "$GITHUB_REPOSITORY" \
          --state open \
          --draft \
          --json number,title,headRefName,author,createdAt \
          --jq '.[] | select(.author.login | startswith("ogenticai-reviewer")) | "  #\(.number) head=\(.headRefName) created=\(.createdAt) — \(.title)"' \
          2>&1 | head -20
        echo "::endgroup::"

        echo "::group::chore(uat) titled PRs (any state, ever)"
        gh pr list \
          --repo "$GITHUB_REPOSITORY" \
          --state all \
          --search 'chore(uat) in:title' \
          --json number,title,headRefName,state,createdAt \
          --jq '.[] | "  #\(.number) [\(.state)] head=\(.headRefName) created=\(.createdAt) — \(.title)"' \
          2>&1 | head -20
        echo "::endgroup::"

        # Emit a concise summary line that aggregates the verdict for OGE-395
        # downstream consumers (humans grepping the log; future automation).
        if [ "${{ steps.autopatch_run.conclusion }}" = "success" ]; then
          # Was a PR actually opened? Cross-check by searching for any chore(uat)
          # PR younger than the workflow start.
          NEW_DRAFT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open --draft \
            --search 'chore(uat) in:title' \
            --json number --jq 'length' 2>/dev/null)
          echo "[autopatch:OGE-395] inner-success=true new-draft-pr-count=${NEW_DRAFT:-?}"
          if [ "${NEW_DRAFT:-0}" = "0" ]; then
            echo "[autopatch:OGE-395] ⚠️  inner action exited success but no chore(uat) draft PR exists — this is the failure mode."
          fi
        else
          echo "[autopatch:OGE-395] inner-conclusion=${{ steps.autopatch_run.conclusion }} outcome=${{ steps.autopatch_run.outcome }}"
        fi
