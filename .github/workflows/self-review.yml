# Self-review: the OgenticAI Reviewer reviews its own PRs (dogfooding).
#
# This workflow is the canonical example consumers should crib from when
# adding the reviewer to their own repo. See docs/INSTALL.md for the
# minimal copy-pasteable version.
#
# Until the OgenticAI Reviewer GitHub App is registered + the four org
# secrets are set, this workflow detects the missing config in a precheck
# step and skips the review cleanly. That's why the Check passes (with a
# notice) on every PR landing here BEFORE the App goes live, and starts
# producing real verdicts AFTER the App + secrets land.
#
# Pinning: this workflow deliberately uses `./.github/actions/review` — the
# LOCAL action, not a version tag (OGE-1666). Consumers should still crib the
# tag-pinned shape from docs/INSTALL.md; this repo is the exception on purpose.
#
# It used to pin a released tag, which meant self-review only ever proved the
# TAG worked and never exercised the action on the branch under review. The
# cost showed up when shipping Reviewer v2: the whole stack reached main —
# green tests, green typecheck, green eval — having never run once as a real
# Action, because ci.yml exercises runReview() against mocks and nothing
# exercised the composite action's actual entry path. The first real execution
# would have been 22 downstream repos when the v2 tag moved.
#
# The old header suggested "force-move the tag locally and trigger by hand" as
# the workaround. That is exactly the manual step nobody performs under time
# pressure. Pointing at the working tree makes every PR its own canary.

name: OgenticAI Reviewer

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    steps:
      # Detect whether the App + secrets are configured. We can't reference
      # `secrets.X` directly in `if:` expressions on jobs/steps in older
      # runner versions, so we read into env in this precheck and gate the
      # subsequent steps on its output.
      - name: Check reviewer config
        id: cfg
        env:
          APP_ID: ${{ secrets.OGENTICAI_REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.OGENTICAI_REVIEWER_APP_KEY }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          missing=()
          [ -z "$APP_ID" ]   && missing+=("OGENTICAI_REVIEWER_APP_ID")
          [ -z "$APP_KEY" ]  && missing+=("OGENTICAI_REVIEWER_APP_KEY")
          [ -z "$ANTHROPIC" ] && missing+=("ANTHROPIC_API_KEY")
          [ -z "$LINEAR" ]   && missing+=("LINEAR_API_TOKEN")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::OgenticAI Reviewer config detected — running self-review."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OgenticAI Reviewer not yet configured — skipping. Missing org secrets: ${missing[*]}. See docs/GITHUB_APP_SETUP.md."
          fi

      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5

      - if: steps.cfg.outputs.configured == 'true'
        # Deliberately the LOCAL action, not @v2 (OGE follow-up).
        # Self-review pinned to the released tag proved only that the tag
        # worked — it never exercised the code on this branch. That let the
        # whole Reviewer v2 stack reach main having never run as an Action,
        # so the first real execution would have been 22 downstream repos.
        # Pointing at the working tree makes every PR its own canary.
        uses: ./.github/actions/review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_app_id: ${{ secrets.OGENTICAI_REVIEWER_APP_ID }}
          github_app_private_key: ${{ secrets.OGENTICAI_REVIEWER_APP_KEY }}
          linear_api_token: ${{ secrets.LINEAR_API_TOKEN }}
          # Auto-patch off for now — flip to "true" once we've watched a few
          # FAIL verdicts and the autoPatchable signal feels reliable.
          auto_patch: "false"
          # Research on here because this is the dogfooding repo and it holds
          # no PHI or MNPI (see the input's docs for who must leave it off).
          # It only does anything on PRs that carry a `[human]`-marked item.
          research: "true"
          # Merge gate: NEEDS_WORK → Check publishes `failure`, blocking merge
          # when branch protection requires this Check. We dogfood the gate
          # here first; consumer repos flip this on their own timeline.
          fail_on: "NEEDS_WORK"
