# The osv-scanner configuration the audit runs under.
#
# Passed explicitly with --config so osv-scanner never reads an
# osv-scanner.toml sitting beside a manifest in the tree under audit. Probed on
# the installed version: a tree config listing every advisory under
# [[IgnoredVulns]] turned a known-vulnerable manifest into zero findings. An
# empty override leaves every advisory reportable, which is the point.
